name: Quality gate

on:
    push:
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring
                  coverage: xdebug
                  tools: composer:v2

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Run mandatory quality gate
              run: composer qa
